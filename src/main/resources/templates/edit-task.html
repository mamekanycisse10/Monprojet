<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Task</title>

    <style>

        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }

        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        input { width: 100%; padding: 10px; margin-bottom: 10px; }

        button { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }

        a { text-decoration: none; color: #007bff; }

    </style>

</head>

<body>



<div class="container">

    <h2>Modifier la tâche</h2>



    <form th:action="@{/api/tasks/edit/{id}(id=${task.id})}" method="post">

        <input type="text" name="title" th:value="${task.title}" required>

        <input type="text" name="description" th:value="${task.description}" required>

        <button type="submit">Mettre à jour</button>

    </form>



    <br>

    <a th:href="@{/api/tasks}">⬅ Retour à la liste</a>

</div>



</body>

</html>
